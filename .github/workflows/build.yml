name: Build, Release & Publish

# Single pipeline so a release created here can publish in the SAME run.
#
#   pull request      discover ─▶ build (changed images only, no push)
#   push main         discover ─▶ publish (build once, push to both registries)
#                                   └─▶ cleanup (GHCR, no dry-run)
#   push tag          discover ─▶ publish ─▶ release
#
# An image is only built when the hash of its recipe (build context,
# Dockerfile, build-args and stage) differs from the
# org.openmodelica.build-deps.hash label of the published image, so a change
# to one Dockerfile does not rebuild every image. Unchanged images cost one
# registry lookup; a release of one gets its immutable tag pointed at the
# digest that is already published. No image is built more than once per run
# either: the push to main goes straight to `publish`, which feeds both
# registries from that single build — the pull request already proved the
# build. A registry we cannot reach fails the job rather than being taken
# for an image that needs rebuilding.
#
# Triggers:
#   push main         Publishes every changed image with the moving tag
#                     (<os>-<version>).
#   schedule          Weekly rolling rebuild — republishes the moving tags of
#                     ALL images, ignoring the hashes, so upstream base-image
#                     and package updates land.
#   push tag          Full release: immutable semver tags for all images, then
#                     a GitHub Release. Tag must be of the form
#                     v<MAJOR>.<MINOR>.<PATCH>.
#   workflow_dispatch Re-publish on demand. Leave the tag input empty to
#                     rebuild all moving tags; pass a global tag (e.g. v2.1.0)
#                     to rebuild all images with immutable tags; pass a single
#                     image tag (e.g. ubuntu-24.04-2.1.0) to rebuild just that
#                     image.
#
# Cosign signing on GHCR happens only for releases (immutable tags): on a
# v-tag push, and on workflow_dispatch re-publishes of a release unless the
# `sign` input is unchecked. Moving-tag publishes (main, schedule) never sign,
# keeping the number of sha256-* signature tags on GHCR to a minimum.

on:
  schedule:
    - cron: '30 3 * * 1'   # Monday 03:30 UTC — Sunday-night rolling rebuild
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: version to (re)publish. Empty = rebuild all moving tags. Global tag (e.g. v2.1.0) = all images with immutable tags. Single image tag (e.g. ubuntu-24.04-2.1.0) = one image with immutable tag.'
        required: false
        default: ''
      force:
        description: 'Rebuild and push even when the published image already carries the current recipe hash.'
        type: boolean
        required: false
        default: true
      sign:
        description: 'Cosign-sign the immutable tags on GHCR when re-publishing a release. Moving-tag-only publishes are never signed.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      publish_matrix: ${{ steps.publish_tags.outputs.matrix }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install -r .ci/requirements.txt

      - name: Compute build matrix
        id: set
        run: echo "matrix=$(python .ci/matrix.py all)" >> "$GITHUB_OUTPUT"

      - name: Compute publish matrix
        id: publish_tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          case "${EVENT_NAME}" in
            schedule)
              echo "matrix=$(python3 .ci/matrix.py publish-matrix)" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              if [[ -z "${INPUT_TAG}" ]]; then
                echo "matrix=$(python3 .ci/matrix.py publish-matrix)" >> "$GITHUB_OUTPUT"
              elif [[ "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "matrix=$(python3 .ci/matrix.py publish-matrix "${INPUT_TAG#v}")" >> "$GITHUB_OUTPUT"
              else
                python3 .ci/matrix.py image "${INPUT_TAG}" > /dev/null
                echo "matrix=$(python3 -c "import json,sys; print(json.dumps([{'tag':sys.argv[1]}],separators=(',',':')))" "${INPUT_TAG}")" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push)
              if [[ "${GH_REF}" == refs/tags/v* ]]; then
                echo "matrix=$(python3 .ci/matrix.py publish-matrix "${GH_REF_NAME#v}")" >> "$GITHUB_OUTPUT"
              elif [[ "${GH_REF}" == refs/heads/main ]]; then
                echo "matrix=$(python3 .ci/matrix.py publish-matrix)" >> "$GITHUB_OUTPUT"
              else
                echo 'matrix=[]' >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  # Pull requests only: prove that the images the PR changes still build.
  # A push to main does not build here — it builds in `publish`, once.
  build:
    name: Build ${{ matrix.image.os }}-${{ matrix.image.version }}
    needs: discover
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      # Only GHCR: a pull request from a fork has no Nexus credentials, and
      # the two registries are published from the same build anyway.
      REGISTRIES: ghcr.io/openmodelica/build-deps
      TAG: ${{ matrix.image.base_tag }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install -r .ci/requirements.txt

      # Reading the hash label of the published image needs no write access,
      # so this works for pull requests from forks too.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything below is skipped when the published image already carries
      # the recipe hash of this checkout.
      - name: Does this image need building?
        id: status
        run: ./.ci/registry-status.sh

      # The Dockerfile tend to be huge, free up some space on the GitHub runners
      - name: Free up disk space
        if: ${{ steps.status.outputs.build == 'true' }}
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_android: "true"
          remove_dotnet: "true"
          remove_haskell: "true"

      - name: Set up Docker Buildx
        if: ${{ steps.status.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build base image and add-ons
        if: ${{ steps.status.outputs.build == 'true' }}
        run: ./.ci/build.sh

  # One build per image, pushed to both registries from that single build so
  # they share a digest.
  publish:
    name: Publish ${{ matrix.image.tag }}
    needs: discover
    if: ${{ needs.discover.outputs.publish_matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover.outputs.publish_matrix) }}
    env:
      REGISTRIES: ghcr.io/openmodelica/build-deps docker.openmodelica.org/build-deps
      SIGN_REGISTRY: ghcr.io/openmodelica/build-deps
      TAG: ${{ matrix.image.tag }}
      # The weekly rebuild exists to pick up upstream base-image and package
      # updates, which no recipe hash can see; a manual dispatch says what it
      # wants through its own input.
      FORCE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force)) && 'true' || 'false' }}
      # Sign only releases: a v-tag push, or a workflow_dispatch re-publish
      # unless its `sign` input is unchecked. Publishes without immutable
      # tags (schedule, push to main, dispatch with an empty tag input)
      # are never signed — publish.sh only signs immutable tags.
      SIGN: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.sign)) && 'true' || 'false' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: pip install -r .ci/requirements.txt

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Nexus Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.openmodelica.org
          username: ${{ secrets.NEXUS_OPENMODELICABOT_USER }}
          password: ${{ secrets.NEXUS_OPENMODELICABOT_PASSWORD }}

      # Everything below is skipped when both registries already carry the
      # recipe hash of this checkout under every tag this job would push.
      - name: Does this image need building?
        id: status
        run: ./.ci/registry-status.sh

      # The Dockerfile tend to be huge, free up some space on the GitHub runners
      - name: Free up disk space
        if: ${{ steps.status.outputs.build == 'true' }}
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_android: "true"
          remove_dotnet: "true"
          remove_haskell: "true"

      - name: Set up Docker Buildx
        if: ${{ steps.status.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install cosign
        if: ${{ steps.status.outputs.build == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build, push and sign image (base + add-ons)
        if: ${{ steps.status.outputs.build == 'true' }}
        run: ./.ci/publish.sh

      - name: Verify signatures
        if: ${{ steps.status.outputs.build == 'true' && env.SIGN == 'true' }}
        run: |
          set -euo pipefail
          eval "$(python .ci/matrix.py image "${TAG}")"
          if [[ -z "${semver}" ]]; then
            echo "Moving-tag-only publish — nothing was signed, skipping verification."
            exit 0
          fi
          CERT_ID="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}"
          CERT_ISSUER="https://token.actions.githubusercontent.com"
          # Signatures are per digest; verifying the immutable tags also
          # covers the moving tags, which point at the same digests.
          tags=("${base_tag}-${semver}")
          for addon in ${addons}; do
            tags+=("${base_tag}-${addon}-${semver}")
          done
          for t in "${tags[@]}"; do
            echo "Verifying ${SIGN_REGISTRY}:${t}"
            cosign verify \
              --certificate-identity="${CERT_ID}" \
              --certificate-oidc-issuer="${CERT_ISSUER}" \
              "${SIGN_REGISTRY}:${t}"
          done

  release:
    name: Create GitHub Release
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Validate tag format: must be v<MAJOR>.<MINOR>.<PATCH>
          echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || \
            { echo "error: tag must be of the form v<semver> (e.g. v2.1.0)"; exit 1; }
          if gh release view "${GITHUB_REF_NAME}" &>/dev/null; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

  # Prune superseded digests and orphaned signatures right after publishing,
  # so re-pushed moving tags don't pile up as untagged versions on GHCR.
  cleanup:
    name: Cleanup container registry
    needs: publish
    permissions:
      packages: write
    uses: ./.github/workflows/cleanup.yml
    with:
      dry-run: false
